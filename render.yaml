services:
  - type: web
    name: trackline-backend
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: MCP_OAUTH_INTERNAL_SECRET
        generateValue: true
      - key: MCP_USERNAME_LOOKUP_SECRET
        generateValue: true
      - key: MCP_OAUTH_ISSUER_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MYSQL_TLS_CA_PEM
        sync: false
      - key: AUTH_DATABASE_URL
        sync: false
      - key: AUTH_MIGRATE_DATABASE_URL
        sync: false
      - key: PROJECT_DATABASE_URL
        sync: false
      - key: PROJECT_MIGRATE_DATABASE_URL
        sync: false
      - key: ISSUE_DATABASE_URL
        sync: false
      - key: ISSUE_MIGRATE_DATABASE_URL
        sync: false
      - key: ACTIVITY_DATABASE_URL
        sync: false
      - key: ACTIVITY_MIGRATE_DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_DATABASE_URL
        sync: false
      - key: AI_MIGRATE_DATABASE_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_CALLBACK_BASE_URL
        sync: false
      - key: OAUTH_FRONTEND_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_INSTALLATION_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_EVIDENCE_TO_OPENROUTER
        value: "false"
      - key: GITHUB_CODE_TO_OPENROUTER
        value: "false"
