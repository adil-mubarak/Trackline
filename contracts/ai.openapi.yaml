openapi: 3.1.0
info:
  title: Trackline AI API
  version: 1.0.0
paths:
  /ai/chat:
    post:
      summary: Send a chat message to the configured OpenRouter model with optional read-only tracker retrieval
      description: >-
        Authenticated server-side proxy. The API key is held by the AI service
        and is never returned to the caller. When the caller has an authenticated
        session, the model may invoke a bounded allowlist of read-only tools that
        retrieve caller-authorized records through the Gateway from Auth,
          Project, Issue, and Activity APIs. When the optional GitHub App is
          configured, it may retrieve bounded metadata for explicitly linked
          pull requests in a connected installed repository when explicitly
          enabled for OpenRouter processing. It never reads
          repository Contents or diffs.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 8000 }
      responses:
        '200':
          description: Model reply
          content:
            application/json:
              schema:
                type: object
                required: [reply, model]
                properties:
                  reply: { type: string }
                  model: { type: string }
        '400': { description: Invalid request }
        '401': { description: OpenRouter rejected the configured API key }
        '402': { description: OpenRouter account requires credits }
        '404': { description: OpenRouter model was not found }
        '429': { description: OpenRouter rate limit reached }
        '503': { description: OpenRouter is not configured }
        '502': { description: OpenRouter request failed or returned an invalid response }
  /github/repositories:
    get:
      summary: List repositories available to the configured GitHub App installation
      description: Returns only repository IDs and display names from the installation. Credentials and installation tokens remain server-side.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Installed repositories available for project selection
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  type: object
                  required: [id, owner, name]
                  properties:
                    id: { type: integer, minimum: 1 }
                    owner: { type: string }
                    name: { type: string }
        '503': { description: GitHub App is not configured }
        '502': { description: GitHub installation repository list unavailable }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
